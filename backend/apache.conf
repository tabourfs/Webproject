<VirtualHost *:80>
    DocumentRoot /var/www/html/frontend
    Alias /api /var/www/html/public/api
    Alias /frontend /var/www/html/frontend

    <Directory /var/www/html/frontend>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/public/api>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/php>
        Options FollowSymLinks 
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
