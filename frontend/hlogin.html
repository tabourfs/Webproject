<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto max-w-3xl px-4 py-6">
        <h1 class="text-2xl font-semibold tracking-tight">Login Page</h1>
       
      </div>
    </header>
    <main class="mx-auto max-w-3xl px-4 py-8">
      <section class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
        <form action="../php/plogin.php" method="POST">
            <ul>
                <li>
                    <label for="username" class="text-lg font-semibold">Username :</label>
                    <input type="text" name="name" placeholder="  Username" class="bg-slate-200 rounded-md required">
                    <span id="error-name" class="error"></span>
                </li>

                <li>
                    <label for="password" class="text-lg font-semibold">Password :</label>
                    <input type="text" name="password" placeholder="  Password" class="bg-slate-200 rounded-md required">
                    <span id="error-password" class="error"></span>
                </li>
            </ul>
            <button
             type="submit"
              class="mt-4 rounded-md bg-slate-800 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700"
              >Send
            </button>
            </form>
      </section>
    </main>
    <script src="js/app.js"></script>
  </body>
</html>
